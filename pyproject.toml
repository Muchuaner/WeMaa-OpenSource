[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wemaa"
version = "0.1.0"
description = "WeMaa: MaiBot core, Maa WeChat adapter, native API and a unified dashboard"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116", "httpx>=0.28", "redis>=5", "boto3>=1.35",
  "Pillow>=11", "SQLAlchemy>=2", "psycopg2-binary>=2.9", "pydantic-settings>=2.7",
  "python-multipart>=0.0.20", "uvicorn>=0.35"
]

[tool.setuptools.packages.find]
include = ["wemaa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
