name: 源码检查
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e . pytest
      - run: python -m pytest tests -q
      - run: python -m unittest discover -s apps/adapter/maa_wechat -p test_endpoint_config.py
  webui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/webui/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: apps/webui
      - run: npm run build
        working-directory: apps/webui
